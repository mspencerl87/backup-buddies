<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Backup Buddies</title>
  <link rel="stylesheet" href="/style.css?v=e379dc49">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="alternate icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/favicon-180.png">
</head>
<body>
  <header>
    <a class="logo" href="/"><img src="/assets/mark.svg" alt="" class="logo-mark">Backup Buddies</a>
    <nav>
      <a href="/about.html">How it works</a>
      <a href="/pricing.html">Pricing &amp; billing</a>
      <a href="/getting-started.html">Getting started</a>
      <a href="/setup.html">Client setup</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/status.html">Feature status</a>
      <a href="/terms.html">Terms</a>
      <a href="/login.html">Log in</a>
      <a href="/signup.html" class="current">Sign up</a>
    </nav>
  </header>

  <main>
    <form id="signup-form">
      <h2 style="margin-top:0">Create your account</h2>

      <a class="btn-google" href="/api/auth/google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7a5.4 5.4 0 0 1 0-3.4V4.97H.95a9 9 0 0 0 0 8.06l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>

      <div class="divider">or</div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">

      <label class="checkbox-row">
        <input type="checkbox" id="accept-terms">
        <span>I've read and accept the <a href="/terms.html" target="_blank" rel="noopener">Terms of Service</a>, including that data stored with a buddy is at my own risk.</span>
      </label>

      <button class="btn" type="submit" id="submit-btn" disabled>Sign up</button>
      <p class="error" id="error"></p>
      <p class="muted">Already have an account? <a href="/login.html">Log in</a></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('signup-form');
    const errorEl = document.getElementById('error');
    const acceptTerms = document.getElementById('accept-terms');
    const submitBtn = document.getElementById('submit-btn');
    const googleBtn = document.getElementById('google-btn');

    acceptTerms.addEventListener('change', () => {
      submitBtn.disabled = !acceptTerms.checked;
    });

    googleBtn.addEventListener('click', (e) => {
      if (!acceptTerms.checked) {
        e.preventDefault();
        errorEl.textContent = 'Please accept the Terms of Service first.';
      }
    });

    const GOOGLE_ERRORS = {
      google_not_configured: 'Google sign-in isn\'t set up yet — use email and password.',
      google_state_mismatch: 'That Google sign-in link expired. Try again.',
      google_token_exchange_failed: 'Could not complete Google sign-in. Try again.',
      google_token_invalid: 'Could not verify that Google account. Try again.',
      google_email_unverified: 'That Google account\'s email isn\'t verified.',
    };
    const errorCode = new URLSearchParams(window.location.search).get('error');
    if (errorCode && GOOGLE_ERRORS[errorCode]) {
      errorEl.textContent = GOOGLE_ERRORS[errorCode];
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!acceptTerms.checked) {
        errorEl.textContent = 'Please accept the Terms of Service first.';
        return;
      }

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, accepted_terms: true }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Something went wrong.';
          return;
        }

        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = 'Could not reach the server. Try again.';
      }
    });
  </script>

  <footer>
    <a href="/terms.html">Terms of Service</a>
    <a href="https://github.com/mspencerl87/backup-buddies-feedback/issues" target="_blank" rel="noopener">Report a bug / request a feature</a>
  </footer>
</body>
</html>
