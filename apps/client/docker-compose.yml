# Backup Buddies client — run this on the machine whose files you're
# backing up. See the "Set up the client" page on your dashboard, or
# apps/web/setup.html, for the full walkthrough.
#
# Easiest way to get this file (and everything else it needs) without
# access to the project's private source repo:
#   curl -fsSL https://app.filegarden.net/client/install.sh | bash
#
# Quick start once you have this directory:
#   1. Copy .env.example to .env and fill in the values it asks for (from
#      your dashboard's Devices card), including BACKUP_DIR_HOST if you
#      want this device to back files up, not just receive them.
#   2. docker compose up -d        (builds the image locally the first
#                                    time — a few minutes — then starts it)
#   3. docker compose logs -f   — you should see "registered this device's
#      node id with the API", then (once your buddy's client is also
#      running and BACKUP_DIR_HOST is set) "backup cycle complete", or
#      "connectivity check succeeded" if this device isn't backing
#      anything up itself.
#
# To restore what a buddy is holding for you:
#   docker compose run --rm client restore <buddy's node id> /data/restored
# (find their node id on your dashboard's Buddies card). Files land under
# DATA_DIR_HOST/restored on this machine.
#
# A local status page — per-buddy pledge usage, what's been sent/received,
# last backup cycle, and a one-click restore — is served at
# http://<this machine's address>:8080 once the container is up (change
# DASHBOARD_PORT in .env to use a different port). It has no login of its
# own and the restore button is a real action — see the port mapping
# below if you want it restricted to this machine instead of your LAN.

services:
  client:
    build: .
    # If you have access to the project's GitHub Container Registry
    # package and it's been made public, pulling is faster than building:
    # image: ghcr.io/yourusername/backup-buddies/client:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed mount point inside the container — BACKUP_DIR_HOST in .env
      # controls what's mounted there on the host side, below.
      - BACKUP_DIR=/backup
    ports:
      # Open on every interface, not just loopback — most people run this
      # headless (a NAS, a home server, a VPS) and manage it from a
      # browser elsewhere on their network, not sitting at that machine.
      # It has no login of its own and the restore button is a real
      # action, so anyone who can reach this machine on this port can see
      # your pledge/buddy info and trigger a restore. If that's not
      # acceptable for where this runs (exposed to the open internet, an
      # untrusted network), bind it to loopback only instead:
      #   - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      # A real, visible folder on this machine — not an opaque
      # Docker-managed volume — so it's easy to find, move, or point your
      # own backup tooling at. Defaults to ./data, next to this file; set
      # DATA_DIR_HOST in .env to use somewhere else instead. Created
      # automatically if it doesn't exist.
      - ${DATA_DIR_HOST}:/data
      # The folder you're backing up. Mounted read-only — this client only
      # ever needs to read these files, never write them. Falls back to an
      # empty local folder when BACKUP_DIR_HOST isn't set in .env, which
      # just means there's nothing to back up (fine for a receive-only
      # device).
      - ${BACKUP_DIR_HOST:-./data/empty-backup-dir}:/backup:ro
