# iroh-relay config for relay-1. Field names verified against the
# iroh-relay 1.3.0 source (the version pinned in docker-compose.yml) —
# re-check them if you bump that image.

# Only customers' devices may use this relay. On every new connection the
# relay POSTs the device's endpoint id to the API (routes/relay.js), which
# answers `true` only for a device registered to an account that isn't
# paused. Strangers, deleted devices, and paused accounts (failed payment,
# free relay allowance used up) are refused.
#
# The bearer token is NOT set here — it comes from the
# IROH_RELAY_HTTP_BEARER_TOKEN environment variable (docker-compose.yml,
# from this directory's .env) and must equal RELAY_ACCESS_TOKEN in
# deploy/app/.env on app-1.
#
# If the API is unreachable, the relay denies everyone: devices that can
# connect directly keep syncing, relayed ones pause until the API is back.
access.http.url = "https://api.filegarden.net/relay/access"

enable_quic_addr_discovery = true

[tls]
# "Manual" here because this box is behind a DNS-only (non-proxied)
# Cloudflare record — point these at a cert you manage yourself (e.g. via
# certbot) or switch to whatever automatic mode the current iroh-relay
# version supports for your setup.
cert_mode = "Manual"
manual_cert_path = "/etc/letsencrypt/live/relay.filegarden.net/fullchain.pem"
manual_key_path = "/etc/letsencrypt/live/relay.filegarden.net/privkey.pem"

[limits]
# New connections accepted per second across the whole relay (burst
# allows the reconnect wave after a relay restart). Flood protection only —
# set well above normal so a restart doesn't strand devices for long.
accept_conn_limit = 50.0
accept_conn_burst = 200

# Hard per-device ceiling on data a device can push through the relay:
# 4 MiB/s (~34 Mbit/s) sustained, 16 MiB bursts. Above most home upload
# speeds, so normal users never notice, but no single device — paid, free,
# or a modified client lying about its usage — can saturate relay-1's
# bandwidth. Raise it if paid users on fast connections hit it.
[limits.client.rx]
bytes_per_second = 4194304
max_burst_bytes = 16777216
