services:
  api:
    # Built locally via `docker compose up --build` for dev, or pulled from
    # GHCR on the server by the deploy workflow (`docker compose pull api`).
    # Set API_IMAGE in deploy/app/.env on the server to your real GHCR path,
    # e.g. ghcr.io/yourusername/backup-buddies/api:latest — the Actions
    # workflow pushes to ghcr.io/<repo>/api, matching your GitHub repo name.
    image: ${API_IMAGE:-backup-buddies-api:local}
    build:
      context: ../../apps/api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: backup_buddies
      POSTGRES_USER: backup_buddies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_buddies"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host or the public internet — only the api
    # container can reach it, over the compose network.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Login for the site gate in the Caddyfile. `:?` makes compose refuse to
    # start instead of handing Caddy an empty hash, which it would fail to
    # parse, taking the API down for devices as well.
    environment:
      SITE_USERNAME: ${SITE_USERNAME:?set SITE_USERNAME in deploy/app/.env}
      SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH:?set SITE_PASSWORD_HASH in deploy/app/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/web:/srv/web:ro
      - ../../apps/client:/srv/client:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
