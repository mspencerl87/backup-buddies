name: Build and deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "deploy/app/**"
      - "db/migrations/**"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest,ghcr.io/${{ github.repository }}/api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_APP_HOST }}
          username: ${{ secrets.LINODE_APP_USER }}
          key: ${{ secrets.LINODE_APP_SSH_KEY }}
          envs: GH_ACTOR,GH_TOKEN
          # set -e so a failed step (e.g. an image that can't be pulled)
          # fails this job loudly in the Actions UI instead of silently
          # falling through to `docker compose up -d`, which would just
          # keep running whatever stale image happened to be cached
          # locally — exactly what happened before this was added.
          script: |
            set -euo pipefail
            cd /opt/backup-buddies
            git pull
            cd deploy/app
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull api
            docker compose up -d
            docker image prune -f
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
