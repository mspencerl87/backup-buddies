name: Build and deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "deploy/app/**"
      - "db/migrations/**"
      - ".github/workflows/deploy.yml"

jobs:
  # Re-stamps ?v=<hash> on the site's CSS/JS links (scripts/
  # stamp-asset-versions.mjs) and commits it back to main if anything
  # changed, so a stylesheet edit never gets masked by a cached copy and
  # nobody has to remember to run the script by hand. Runs before the
  # deploy job's `git pull` on app-1, so the server picks up the stamped
  # commit. A push made with GITHUB_TOKEN doesn't trigger workflows, so
  # this can't loop.
  stamp-asset-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp and commit if changed
        run: |
          node scripts/stamp-asset-versions.mjs
          if git diff --quiet -- apps/web; then
            echo "Asset versions already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Stamp asset versions"
          # Someone may have pushed since checkout — rebase once and retry.
          # If the push still fails (e.g. branch protection), warn rather
          # than block the deploy — an unstamped version only risks a
          # stale cached stylesheet, not a broken site.
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main) \
            || echo "::warning::Couldn't push stamped asset versions — run scripts/stamp-asset-versions.mjs and commit by hand."

  build-and-push:
    needs: stamp-asset-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest,ghcr.io/${{ github.repository }}/api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Shared with build-client.yml's publish-version job, which also runs
    # `git pull` in app-1's checkout.
    concurrency:
      group: app-1-checkout
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_APP_HOST }}
          username: ${{ secrets.LINODE_APP_USER }}
          key: ${{ secrets.LINODE_APP_SSH_KEY }}
          envs: GH_ACTOR,GH_TOKEN
          # set -e so a failed step (e.g. an image that can't be pulled)
          # fails this job loudly in the Actions UI instead of silently
          # falling through to `docker compose up -d`, which would just
          # keep running whatever stale image happened to be cached
          # locally — exactly what happened before this was added.
          script: |
            set -euo pipefail
            cd /opt/backup-buddies
            git pull
            cd deploy/app
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull api
            docker compose up -d
            # up -d doesn't restart Caddy for a changed Caddyfile; a reload
            # applies it (a no-op if unchanged). It refuses an invalid one,
            # keeping the running config and failing this job. Retried
            # because a just-recreated Caddy takes a moment to accept it.
            reloaded=0
            for attempt in 1 2 3 4 5; do
              if docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
                reloaded=1
                break
              fi
              sleep 3
            done
            [ "$reloaded" = 1 ]
            docker image prune -f
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
