name: Build and deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "deploy/app/**"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest,ghcr.io/${{ github.repository }}/api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_APP_HOST }}
          username: ${{ secrets.LINODE_APP_USER }}
          key: ${{ secrets.LINODE_APP_SSH_KEY }}
          script: |
            cd /opt/backup-buddies/deploy/app
            docker compose pull api
            docker compose up -d
            docker image prune -f
