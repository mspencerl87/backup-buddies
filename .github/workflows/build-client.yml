name: Build and publish client image

# This only builds and pushes the image — unlike the API, there's no
# server to deploy it to. Customers pull ghcr.io/<repo>/client:latest
# themselves via apps/client/docker-compose.yml.
on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - ".github/workflows/build-client.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the provenance attestation below: id-token lets the job get a
      # short-lived signing certificate for this exact workflow run, and
      # attestations lets it store the signed statement on GitHub.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # The version devices compare against, so each release is also
      # pullable (and verifiable) by number, not just as :latest.
      - name: Read client version
        id: version
        run: echo "version=$(grep -m1 '^version' apps/client/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/client
          build-args: BB_INSTALL_KIND=image
          push: true
          tags: ghcr.io/${{ github.repository }}/client:latest,ghcr.io/${{ github.repository }}/client:${{ steps.version.outputs.version }},ghcr.io/${{ github.repository }}/client:${{ github.sha }}

      # Build provenance: a statement, signed by GitHub for this run, that
      # the image with this digest was built by this workflow in this public
      # repo from this commit. Anyone can check it with
      #   gh attestation verify oci://ghcr.io/mspencerl87/backup-buddies/client:<version> --owner mspencerl87
      # so "the code is open, but is that what I'm running?" has an answer
      # people can verify themselves (see the client README).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/client
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Devices learn about a release from app-1's checkout (Caddy serves
  # apps/client from it at /client/, and update_check.rs and the web
  # dashboard read /client/Cargo.toml). That used to be a manual `git pull`
  # after each client release, and when it lagged, devices kept saying "up
  # to date" until an unrelated API deploy happened to pull it in. Runs
  # only once the image is published, so app-1 never advertises a version
  # that can't be pulled yet. Nothing to restart: the folder is
  # bind-mounted.
  publish-version:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Shared with deploy.yml's deploy job, so two pushes landing together
    # don't run `git pull` in the same checkout at once.
    concurrency:
      group: app-1-checkout
      cancel-in-progress: false
    steps:
      - name: Update app-1's checkout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_APP_HOST }}
          username: ${{ secrets.LINODE_APP_USER }}
          key: ${{ secrets.LINODE_APP_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/backup-buddies
            git pull --ff-only
            grep -m1 '^version' apps/client/Cargo.toml
